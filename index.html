<script>
'use strict';
/* ===== world contract (do not change without bumping GEN_VERSION) ===== */
const GEN_VERSION=16, CH=32, RANK='DWSGFCM';
let SEED=123456, R0=400, RR=2500;
const ENVT=4, ENVREC=3; // no heat / cold damage any more; only slow recovery: ENVREC hp every ENVT seconds
/* ALTITUDE decides the terrain: the height 0..255 is cut into 8 fixed bands (4 classes x 2): 0 deep sea, 1 shallows | 2 sand, 3 lowland grass | 4 highland grass, 5 highland wasteland | 6 mountain wasteland, 7 snowfield.
   There is no biome word / letter array any more. Letters: D W S G R M (T is no longer produced). */
const sm=t=>{t=t<0?0:t>1?1:t;return t*t*(3-2*t);};
/* ===== world hierarchy: WORLD SEED -> SECTION seed -> chunk-level random numbers inside the section =====
   A section = 2^25 x 2^25 chunks (2^31 x 2^31 cells). Section seed = hash(world seed, section x, section y). Inside a section every cell / lattice point is hashed from its
   in-section int32 coordinates, so no value needs more than 32 bits, and the pattern differs from section to section (no repetition).
   A lattice point that falls over a section border is carried into the neighbouring section, so interpolation stays continuous across borders.
   Position = origin chunk (OX,OY: f64 integers, exact up to 2^53) * 64 + local cell (small ints around the player; floating origin). */
const SECN=2147483648,SECC=67108864; // section = 2^25 chunks
const WC=2251799813685248,HC=1125899906842624,SW=33554432,SH=16777216; // the world is closed: chunk coordinates live in [-2^50, 2^50) and wrap (2^51 chunks = 2^26 sections per axis)
const wrapC=c=>c-Math.floor((c+HC)/WC)*WC; // exact in f64 (|c| < 2^53)
let OX=0,OY=0,FX=0,FY=0,FU=0,FQ=0,FSX=0,FSY=0,SSX=NaN,SSY=NaN,SSV=0;
function setFrame(x,y){x|=0;y|=0;const cx=wrapC(OX+(x>>5)),cy=wrapC(OY+(y>>5)),sx=Math.floor(cx/SECC),sy=Math.floor(cy/SECC); // frame = the cell (x,y): its section and in-section coordinates
 FX=x;FY=y;FSX=sx;FSY=sy;FU=(cx-sx*SECC)*32+(x&31);FQ=(cy-sy*SECC)*32+(y&31);}
function secSeed(sx,sy){if(sx===SSX&&sy===SSY)return SSV;let h=Math.imul(SEED|0,0x9e3779b1)^Math.imul(sx|0,0x85ebca6b)^Math.imul(sy|0,0xc2b2ae35);h^=h>>>15;h=Math.imul(h,0x2c1b3c6d);h^=h>>>12;h=Math.imul(h,0x297a2d39);h^=h>>>15;SSX=sx;SSY=sy;SSV=h;return h;}
function hcore(sx,sy,a,b,s){let h=Math.imul(a|0,0x27d4eb2d)^Math.imul(b|0,0x165667b1)^Math.imul(s|0,0x9e3779b1)^secSeed(sx,sy);h^=h>>>15;h=Math.imul(h,0x85ebca6b);h^=h>>>13;h=Math.imul(h,0xc2b2ae35);h^=h>>>16;return h>>>24;} // 0..255
function hsh(a,b,s){let u=FU+(a-FX),v=FQ+(b-FY),sx=FSX,sy=FSY; // cell-level hash, a/b = local cells near the frame cell
 if(u<0){u+=SECN;sx--;}else if(u>=SECN){u-=SECN;sx++;}if(v<0){v+=SECN;sy--;}else if(v>=SECN){v-=SECN;sy++;}
 if(sx>=SH)sx-=SW;else if(sx<-SH)sx+=SW;if(sy>=SH)sy-=SW;else if(sy<-SH)sy+=SW;return hcore(sx,sy,u,v,s);}
function hlat(k,gx,gy,s){const M=1<<(31-k);let sx=FSX,sy=FSY; // lattice-point hash (lattice every 2^k cells), carried over section borders
 if(gx<0){gx+=M;sx--;}else if(gx>=M){gx-=M;sx++;}if(gy<0){gy+=M;sy--;}else if(gy>=M){gy-=M;sy++;}
 if(sx>=SH)sx-=SW;else if(sx<-SH)sx+=SW;if(sy>=SH)sy-=SW;else if(sy<-SH)sy+=SW;return hcore(sx,sy,gx,gy,s+(k<<8));}
function vn(x,y,k,s){const hf=1<<(k-1),sz=1<<k,u=FU+(x-FX)-hf,v=FQ+(y-FY)-hf,gx=Math.floor(u/sz),gy=Math.floor(v/sz),tx=((u-gx*sz)<<6)>>k,ty=((v-gy*sz)<<6)>>k; // lattice every 2^k cells (k=6: chunk centres)
 const sx=(tx*tx*(192-2*tx))>>12,sy=(ty*ty*(192-2*ty))>>12,a=hlat(k,gx,gy,s),b=hlat(k,gx+1,gy,s),c=hlat(k,gx,gy+1,s),d=hlat(k,gx+1,gy+1,s);
 const t=a+(((b-a)*sx)>>6),w=c+(((d-c)*sx)>>6);return t+(((w-t)*sy)>>6);}
/* climate 0..255 (128 = temperate): two very large noises (2^13 / 2^11 cells) + height (high = cold). NOT bound to x, y or the distance from the origin. */
function clim(x,y,t){let n=(179*vn(x,y,13,1)+77*vn(x,y,11,2))>>8;n=Math.min(255,Math.max(0,128+(((n-128)*512)>>8)));return Math.min(255,Math.max(0,n-((t-128)>>2)));}
const climateAt=(x,y)=>{const ix=Math.floor(x),iy=Math.floor(y);setFrame(ix,iy);return clim(ix,iy,heightT(ix,iy))/255;}; // float view for gameplay/sky only
function genReset(){SSX=NaN;SSY=NaN;NCV.fill(255);RCV.fill(0);CCV.fill(0);} // origin / seed changed: drop every cache
/* mountain caves: a lattice (every 16 cells) of jittered nodes joined by tunnels; edges exist with p=0.65 (> 0.5, so the network percolates and runs through the mountain). Integer only.
   Geometry is computed relative to the lattice cell, so it is independent of the origin. */
function segD(px,py,ax,ay,bx,by,r2){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy,ex=px-ax,ey=py-ay,dot=ex*dx+ey*dy; // is (px,py) within sqrt(r2) of the segment?
 if(dot<=0)return ex*ex+ey*ey<=r2;if(dot>=l2){const fx=px-bx,fy=py-by;return fx*fx+fy*fy<=r2;}const cr=ex*dy-ey*dx;return cr*cr<=r2*l2;}
/* ===== CLUMP FIELD: discrete blobs and voids that can never trap a route =====
   One blob per lattice cell (2^k): present with probability pa/256, centre jittered, radius rn..rm. A present blob is a HUB (about 45 %) or a LEAF; a leaf may join ONE hub that lies west or north of it (probability pj/256) by a short bridge.
   Each node has at most one parent and a parent is always a hub, so every cluster is a star (hub + up to 2 leaves) and the union of all blobs is a FOREST: it has no loop, so it can never enclose free space.
   Blobs stay inside their own cell with a margin, so neighbouring clusters keep a gap of at least 2 cells: the free space is ONE connected region everywhere, with no sealed pockets.
   Everything is hashed from lattice coordinates, so it is reproducible from the seed and needs no neighbourhood search. sh (0..2) only ERODES the shapes (never grows them), so topology is kept. */
const isP=(k,a,b,s,pa)=>hlat(k,a,b,s)<pa,isH=(k,a,b,s,pa)=>hlat(k,a,b,s)<pa&&hlat(k,a,b,s+1)>=145; // present / hub
function isPar(k,a,b,s,pa,pj){if(hlat(k,a,b,s)>=pa||hlat(k,a,b,s+1)<145||hlat(k,a,b,s+2)>=pj)return 0; // 0 none, 1 west hub, 2 north hub (leaf only)
 const w=isH(k,a-1,b,s,pa),n=isH(k,a,b-1,s,pa);return w&&n?((hlat(k,a,b,s+3)&1)?1:2):w?1:n?2:0;}
function clump(x,y,k,s,pa,pj,sh){const S=1<<k,rm=(S*3)>>3,rn=((rm*5)/6)|0,jr=S-2*rm-1,rb=((rn*rn)>>1)>>sh,
 px=FU+(x-FX),py=FQ+(y-FY),gx=Math.floor(px/S),gy=Math.floor(py/S),qx=px-gx*S,qy=py-gy*S;
 const cX=(a,b)=>rm+1+((hlat(k,a,b,s+4)*jr)>>8),cY=(a,b)=>rm+1+((hlat(k,a,b,s+5)*jr)>>8);
 if(isP(k,gx,gy,s,pa)){const ax=cX(gx,gy),ay=cY(gx,gy),dx=qx-ax,dy=qy-ay,o=(dx>0?1:0)|(dy>0?2:0)|(Math.abs(dx)>Math.abs(dy)?4:0),
   r=rn+((hlat(k,gx,gy,s+6)*(rm-rn+1))>>8)-sh-((hlat(k,gx,gy,s+8+o)>>7)&1); // each of the 8 octants of the blob is 0 or 1 cell smaller: a rough, star-shaped outline
  if(r>0&&dx*dx+dy*dy<=r*r)return 1;
  if(rb>0){const pr=isPar(k,gx,gy,s,pa,pj);if(pr===1&&segD(qx,qy,ax,ay,cX(gx-1,gy)-S,cY(gx-1,gy),rb))return 1;if(pr===2&&segD(qx,qy,ax,ay,cX(gx,gy-1),cY(gx,gy-1)-S,rb))return 1;}}
 if(rb>0){if(isPar(k,gx+1,gy,s,pa,pj)===1&&segD(qx,qy,cX(gx,gy),cY(gx,gy),cX(gx+1,gy)+S,cY(gx+1,gy),rb))return 1; // bridges of the leaves east and south of this hub
  if(isPar(k,gx,gy+1,s,pa,pj)===2&&segD(qx,qy,cX(gx,gy),cY(gx,gy),cX(gx,gy+1),cY(gx,gy+1)+S,rb))return 1;}
 return 0;}
const lavaMt=(px,py)=>hlat(9,Math.floor(px/512),Math.floor(py/512),60)>=140; // LAVA mountain (about 45 %) or plain CAVE mountain: decided per 512x512 square, which lines up with the clump lattice
/* CAVE INTERIOR = 8x8 tile patterns (4x4 tiles make one 32x32 chunk). Every pattern keeps floor in the middle of all four edges (2 cells each), so any two neighbouring tiles connect and the whole cave is one network.
   . floor  # rock mass  P pillar  ~ shallow liquid  O deep liquid. The pattern of a tile comes from the tile's lattice hash (lattice every 8 cells) through a weight table. */
const TPAT=[
 ["........","........","........","........","........","........","........","........"], // 0 open hall
 ["##....##","##....##","........","........","........","........","##....##","##....##"], // 1 four corner blocks (cross-shaped passage)
 ["........","........","..####..","..####..","..####..","..####..","........","........"], // 2 ring passage around a rock mass
 ["........","........","..P..P..","........","........","..P..P..","........","........"], // 3 four pillars
 ["........","........","........","...PP...","...PP...","........","........","........"], // 4 centre pillar block
 ["........",".P..P...","........","........",".P..P...","........","........","........"], // 5 pillar lattice (3 cells)
 ["........","........","..~~~~..","..~OO~..","..~OO~..","..~~~~..","........","........"], // 6 pool
 ["##......","#.......","........","........","........","........",".......#","......##"], // 7 rocks top-left / bottom-right
 ["......##",".......#","........","........","........","........","#.......","##......"], // 8 rocks top-right / bottom-left
 ["###.....","###.....","###.....","........","........","....P...","........","........"]  // 9 big corner block + one pillar
],TW_CAVE=[0,0,1,2,3,3,4,5,5,6,7,8,9,3,5,4],TW_LAVA=[0,0,0,0,1,2,6,6,6,6,7,8,9,3],TPC=TPAT.map(t=>t.map(r=>Array.from(r,c=>c==='.'?1:c==='#'?0:c==='P'?4:c==='~'?2:3)));
function cave(x,y,a){ // 0 wall, 1 floor, 2 shallow liquid (walkable), 3 deep liquid (impassable), 4 pillar
 const px=FU+(x-FX),py=FQ+(y-FY),tx=Math.floor(px/8),ty=Math.floor(py/8),lx=px-tx*8,ly=py-ty*8,tw=lavaMt(px,py)?TW_LAVA:TW_CAVE;
 return TPC[tw[(hlat(3,tx,ty,101)*tw.length)>>8]][ly][lx];}
function okLand(x,y){const l=ninfo(x,y)&7;return l>=2&&l<=5;}
/* ENTRANCE GATE: in front of a cave entrance E (outward direction d) a roofed stone passage: floor on E+d and E+2d, stone walls on both sides. A third of the entrances get one. */
let GD=0;
function gateAt(x,y){ // is (x,y) a cell of an entrance gate? 0 none, 2 passage floor (roofed), 6 stone wall, 4 clearing at the exit (no objects). Two passes: a passage floor always wins over a neighbouring gate's wall, so no entrance is sealed
 for(let pass=0;pass<2;pass++)for(let d=0;d<4;d++){const dx=NDX[d],dy=NDY[d];
  for(let k=1;k<=3;k++)for(let s=-1;s<=1;s++){if((s===0)!==(pass===0)||(k===3&&s!==0))continue;const ex=x-dx*k+dy*s,ey=y-dy*k-dx*s; // cell = E + k*d + s*p, p = (-dy,dx)
   if((ninfo(ex,ey)&7)!==6)continue;const hg=hsh(ex,ey,43)<96; // about a third of the doorways get a gate; a doorway in a flat wall (no natural pocket) always does
   if(!okLand(ex+dx,ey+dy)||!okLand(ex+2*dx,ey+2*dy)||!okLand(ex+3*dx,ey+3*dy))continue; // 3 cells of dry open ground in front of the entrance
   if(gateK(ex,ey,true)===1&&GD===d){if(!hg){let sc=0;for(let q=0;q<8;q++)if((ninfo(ex+dx+NDX[q],ey+dy+NDY[q])&7)===6)sc++;if(sc>=5)continue;}return k===3?4:pass===0?2:6;}}}
 return 0;}
const AREAC=c=>(c&7)===6||((c&7)<=4&&(c&192)===128&&!(c&8)); // INSIDE: a cave, or a roofed building floor (bit 7 without bit 6). Inside = ceiling texture, outside = sky
let SC=0,SV=0,SO=0,FAST=false;
/* cell code: bits0-2 letter (D W S G T R M), bit3 wall, bits4-5 special (1 ice, 2 lava), bit6 ENTRANCE, bit7 PILLAR (a wall cell inside a cave).
   AREA: every mountain cell (letter M) belongs to the mountain AREA = "indoors": floor + ceiling. Everything else is outdoors (sky). */
let TL=0,TSP=0,TOB=0,TC=0,TPOS=0,TIDXI=0;
/* gen12 + v19 height field: region 98 % (lattice 2^15 cells = 32 regions), chunk 1 % (lattice 2^10 cells = 32 chunks), cell 1 % = the cell's own value LERPed with its 2x2 neighbours
   (blend fractions hashed per cell, so the straight LERP borders get noise). Plain linear LERP, no smoothstep. Output 0..255. */
function lerpK(x,y,k,sd){const sz=2**k,u=FU+(x-FX),v=FQ+(y-FY),gx=Math.floor(u/sz),gy=Math.floor(v/sz),tx=(u-gx*sz)/sz,ty=(v-gy*sz)/sz,
 a=hlat(k,gx,gy,sd),b=hlat(k,gx+1,gy,sd),c=hlat(k,gx,gy+1,sd),d=hlat(k,gx+1,gy+1,sd),t=a+(b-a)*tx,w=c+(d-c)*tx;return t+(w-t)*ty;}
function cell2(x,y){const a=hsh(x,y,31),b=hsh(x+1,y,31),c=hsh(x,y+1,31),d=hsh(x+1,y+1,31),u=hsh(x,y,33)/255,v=hsh(x,y,34)/255,t=a+(b-a)*u,w=c+(d-c)*u;return t+(w-t)*v;}
function heightT(x,y){return Math.min(255,Math.max(0,Math.round(0.98*lerpK(x,y,10,11)+0.01*lerpK(x,y,5,21)+0.01*cell2(x,y))));}
function terr(x,y){setFrame(x,y);const t=heightT(x,y),c=clim(x,y,t); // DEMON REALM. ALTITUDE 0..255 -> 4 classes x 2 halves = 8 terrains: swamp (deep, shallow) | wasteland (sand, dead grass) | forest (withered, conifer) | mountain (cave, lava cave)
 const k=t>>6,s=(t>>5)&1; // k: class, s: lower (0) / upper (1) half of the class
 const l=k<2?(k<<1)|s:k===2?4+s:6; // letter: D deep swamp, W shallow bog | S sand, G dead grass | F withered forest, C conifer forest | M mountain
 const pos=l===6?48+(t&63)*16/64:0,idx=k>=2?1:0; // pos: height inside a mountain (48..64); idx 1 = forest or higher (cave entrances / gates may exist there)
 let sp=0;if(l===1&&c<31)sp=1;else if(k===3&&s)sp=1; // cold shallows freeze; the upper mountain is covered with ice
 let ob=0;if(!sp&&l>=2&&l<=5){const h=hsh(x,y,9),d=vn(x,y,4,10),gt=d>140?5:1; // objects: 1 grass, 2 shrub, 3 tree, 4 rock, 5 dense grass - trees and rocks stand in CLUMPS with open lanes between them
  if(k===1)ob=s?(h<90+((120*d)>>8)?gt:h>=246?2:0):(clump(x,y,5,100,215,170,0)?(h>=120?4:h>=100?2:0):(h>=244?2:0)); // wasteland: dead grass and dry brush | sand with rock fields
  else{const gv=clump(x,y,5,120,215,150,0); // forest: groves of trees, lighter wood between them

function fxUpdate(dt){EN.shake=Math.max(0,EN.shake-dt);

 if(EN.fT<=0){EN.fT=2+rn()*3;if(FIRE.length<3){const a=rn()*6.283,r=6+rn()*14,x=P.x+Math.cos(a)*r,y=P.y+Math.sin(a)*r;

 for(let i=FIRE.length-1;i>=0;i--){const f=FIRE[i];if(Math.hypot(f.x-P.x,f.y-P.y)>34){FIRE.splice(i,1);continue;}

function drawFireball(o){const z=o.z||0.5,q=0.75+0.1*Math.sin(o.t*40);cell(Math.floor(o.x),Math.floor(o.y));cfog((CODE&7)===6?1:0); // fireball: glowing core + two crossed flame planes

function drawFxE(e){const o=e.o;let tex,qh,z=0,cross=0;

 else{const f=o.t/o.life;z=o.z;
  if(o.k==='f'){tex=FXT.fl[((o.t*12+o.s)|0)&3];qh=o.size*(1-f*0.6);cross=o.cross;}

 cell(Math.floor(o.x),Math.floor(o.y));cfog((CODE&7)===6?1:0);ZOFF=Math.max(0,z-qh/2);const hw=qh/2;
 if(cross){seg(o.x-hw,o.y,o.x+hw,o.y,0,1,tex,qh,0,0);seg(o.x,o.y-hw,o.x,o.y+hw,0,1,tex,qh,0,0);}
 else{const rx=PLX/PL*hw,ry=PLY/PL*hw;seg(o.x-rx,o.y-ry,o.x+rx,o.y+ry,0,1,tex,qh,0,0);}

/* ===== SFX: synthesized once in JS -> WAV -> HTMLAudio pools (no WebAudio; same method as the footsteps) ===== */
let SFXC=null,VOICES=[];const MAXV=8,NV=3; // MAXV: max simultaneous effects; NV: clips per effect (same effect can overlap NV times)
const PRI={die:5,boom:5,shock:4,hurt:4,clang:3,hit:3,bolt:2,swing:2,potion:2,coin:1},GAP={swing:0.08,hit:0.04,clang:0.05,coin:0.04,bolt:0.05,boom:0.05,shock:0.1,hurt:0.1,die:0.1,potion:0.1},LASTT={};
const LEN={swing:0.25,hit:0.17,clang:0.33,hurt:0.28,die:0.55,boom:0.75,shock:0.55,coin:0.32,potion:0.38,bolt:0.38};
function sEnv(tt,dur,vol){return tt<0.005?vol*tt/0.005:vol*Math.pow(0.0001/vol,(tt-0.005)/(dur-0.005));}
function sTone(buf,type,f0,f1,dur,vol,dl){dl=dl||0;const i0=Math.floor(dl*SR),i1=Math.min(buf.length,Math.ceil((dl+dur+0.02)*SR)),fe=Math.max(20,f1);let ph=0;
 for(let i=i0;i<i1;i++){const tt=i/SR-dl;if(tt>dur)break;ph+=f0*Math.pow(fe/f0,tt/dur)/SR;ph-=Math.floor(ph);
  const w=type==='sine'?Math.sin(6.2831853*ph):type==='square'?(ph<0.5?1:-1):type==='triangle'?(ph<0.5?4*ph-1:3-4*ph):2*ph-1;buf[i]+=w*sEnv(tt,dur,vol);}}
function sNoise(buf,dur,vol,f0,f1,type,q,dl){dl=dl||0;const i0=Math.floor(dl*SR),i1=Math.min(buf.length,Math.ceil((dl+dur+0.02)*SR)),fe=Math.max(20,f1);let x1=0,x2=0,y1=0,y2=0,c=[0,0,0,0,0];
 for(let i=i0;i<i1;i++){const tt=i/SR-dl;if(tt>dur)break;if(((i-i0)&31)===0)c=biquad(type,f0*Math.pow(fe/f0,tt/dur),q||1); // filter sweep, coefficients refreshed every 32 samples
  const x=Math.random()*2-1,y=c[0]*x+c[1]*x1+c[2]*x2-c[3]*y1-c[4]*y2;x2=x1;x1=x;y2=y1;y1=y;buf[i]+=y*sEnv(tt,dur,vol);}}
function sRender(n){const buf=new Float32Array(Math.floor(SR*LEN[n])),T=(...a)=>sTone(buf,...a),N=(...a)=>sNoise(buf,...a);
 switch(n){
 case 'swing':N(0.22,0.35,500,2600,'bandpass',1.2);break; // blade whoosh
 case 'hit':N(0.14,0.7,2200,250,'lowpass',1);T('square',170,55,0.14,0.35);break; // flesh hit
 case 'clang':T('triangle',1250,1200,0.3,0.4);T('square',1950,1900,0.12,0.15);N(0.06,0.4,6000,3000,'highpass',1);break; // sword on shield
 case 'hurt':T('sawtooth',230,70,0.25,0.4);N(0.16,0.4,600,150,'lowpass',1);break;
 case 'die':T('sawtooth',320,40,0.5,0.35);N(0.4,0.3,1200,100,'lowpass',1);break;
 case 'boom':N(0.7,0.9,1400,70,'lowpass',0.7);T('sine',95,28,0.6,0.8);break;
 case 'shock':N(0.5,0.6,600,60,'lowpass',1);T('sine',70,25,0.5,0.9);break;
 case 'coin':T('square',988,988,0.07,0.2);T('square',1319,1319,0.22,0.2,0.07);break;
 case 'potion':[523,659,784,1047].forEach((f,i)=>T('triangle',f,f,0.14,0.25,i*0.07));break;
 case 'bolt':T('sawtooth',180,900,0.35,0.25);N(0.3,0.2,400,3000,'bandpass',2);break;}
 for(let i=0;i<buf.length;i++)buf[i]=Math.tanh(buf[i]*0.6); // master level + soft clip
 return buf;}
function sfxInit(){if(SFXC)return;SFXC={};for(const n in PRI){SFXC[n]=[];for(let v=0;v<NV;v++){const a=new Audio(wavUrl(sRender(n)));a.preload='auto';a._t=0;a._pri=0;SFXC[n].push(a);}}} // NV differently-noised clips per effect
function sfx(n,v){if(!SND||!SFXC)return;v=v===undefined?1:v;if(v<0.03)return;const k=SFXC[n];if(!k)return;
 const now=performance.now(),pr=PRI[n]||1;
 if(now-(LASTT[n]||-1e9)<(GAP[n]||0.04)*1000)return; // same effect retriggered within a few ms: skip
 VOICES=VOICES.filter(a=>!a.paused&&!a.ended);
 if(VOICES.length>=MAXV){let w=0;for(let i=1;i<VOICES.length;i++){const x=VOICES[i],y=VOICES[w];if(x._pri<y._pri||(x._pri===y._pri&&x._t<y._t))w=i;}
  if(VOICES[w]._pri>pr)return; // everything playing is more important: drop the new one
  try{VOICES[w].pause();}catch(e){}VOICES.splice(w,1);} // steal the oldest/weakest voice
 let a=null;const s=(Math.random()*k.length)|0;for(let j=0;j<k.length;j++){const c=k[(s+j)%k.length];if(c.paused||c.ended){a=c;break;}}
 if(!a){a=k[0];for(const c of k)if(c._t<a._t)a=c;VOICES=VOICES.filter(x=>x!==a);} // all clips of this effect busy: restart the oldest
 try{a.currentTime=0;a.volume=Math.min(1,v);a._t=now;a._pri=pr;const p=a.play();if(p&&p.catch)p.catch(()=>{});VOICES.push(a);LASTT[n]=now;}catch(e){}}
/* ===== first-person gear: sword (right hand) and shield (left hand), drawn in 5 greys ===== */
function mk5(fn,n){n=n||32;const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),im=x.createImageData(n,n),b=new Uint32Array(im.data.buffer);
 for(let y=0;y<n;y++)for(let X=0;X<n;X++){const v=fn(X,y);if(v>=0)b[y*n+X]=PK5(G5[v]);}x.putImageData(im,0,0);return c;}
const WCV=mk5((x,y)=>{const dx=Math.abs(x-31.5); // sword: 64x64 sprite (drawn at 2x), long blade
 if(y===0)return dx<1.5?0:-1;
 if(y<=40){const h=Math.min(3,0.6+(y-1)*0.3);if(dx<h)return dx<0.8?4:(x<31.5?3:2);return dx<h+1?0:-1;} // blade + outline
 if(y===41||y===46)return (x>=16&&x<=47)?0:-1; // cross guard
 if(y<=45)return (x>=17&&x<=46)?(y<44?3:2):(x===16||x===47)?0:-1;
 if(y<=57)return dx<1.5?(y%4===0?2:1):dx<2.5?0:-1; // grip
 return dx<3.5?(y===58?3:2):dx<4.5?0:-1;},64); // pommel
const WSH=mk5((x,y)=>{const u=x-15.5,v=y-15.5,r=Math.hypot(u,v);if(r>14.5)return -1;if(r>13)return 0;if(r>10.8)return u+v<0?4:3; // rim
 if(r>9.8)return 0;if(Math.abs(u)<1.7||Math.abs(v)<1.7)return r<3.5?4:4-((u+v>0)?1:0)-0; // cross
 if(r<3.5)return 3;return (u<0)===(v<0)?1:2;}); // quartered face

let ASPECT='AUTO',RROWS=240,PADON=true; // pads are always drawn (touch detection is unreliable in Tor Browser)
const boss=document.getElementById('boss'),bossT=document.getElementById('bossT'),bossF=document.getElementById('bossF');
const UI={hp:'AUTO',hpColor:'#6c6',hold:30}; // settings: hp = AUTO | ALWAYS | OFF; the bar keeps one colour, the state is a text tag
let lastHp=100,hpHold=0;
const CMPD=[['N',-Math.PI/2],['E',0],['W',Math.PI],['S',Math.PI/2]]; // north = -y (up on the map), east = +x; P.a = facing angle
let cmpC=null,cmpX=null,cmpCol='#fff',cmpT=0;
function drawCompass(){ // N E S W letters only, sliding with the facing direction (240 degrees wide); no frame, no ticks
 const W=400,H=22,span=Math.PI*4/3,half=span/2,ppr=W/span;
 if(!cmpC){cmpC=document.createElement('canvas');cmpC.width=W;cmpC.height=H;
  cmpC.style.cssText='display:block;width:20em;height:1.1em';
  cmp.textContent='';cmp.appendChild(cmpC);cmpX=cmpC.getContext('2d');}
 if(cmpT++%30===0)cmpCol=getComputedStyle(cmp).color;
 const c=cmpX;c.clearRect(0,0,W,H);
 c.textAlign='center';c.textBaseline='middle';c.shadowColor='#000';c.shadowBlur=4;
 const L=['N','E','S','W'];
 for(let i=0;i<4;i++){
  let d=-Math.PI/2+i*Math.PI/2-P.a;d-=2*Math.PI*Math.round(d/(2*Math.PI));
  const ad=Math.abs(d);if(ad>=half)continue;
  const x=W/2+d*ppr,near=1-ad/half;
  c.globalAlpha=Math.pow(near,0.6);
  c.fillStyle=i===0?'#e66':cmpCol;
  c.font='bold '+Math.round(13+7*near)+'px monospace';
  c.fillText(L[i],x,H/2+1);}
 c.globalAlpha=1;}
function drawBar(){if(P.hp!==lastHp)hpHold=UI.hold;lastHp=P.hp;if(hpHold>0)hpHold--;
 const show=UI.hp==='ALWAYS'||(UI.hp==='AUTO'&&(P.hp<100||hpHold>0));boss.style.display=show?'block':'none';if(!show)return;

function layout(){const st=document.getElementById('stage'),iw=innerWidth,ih=innerHeight,touch=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;

 const cw=Math.min(vw,vh*a),ch=cw/a,cols=Math.round(RROWS*a);
 if(cols!==W||RROWS!==H)setRes(cols,RROWS); // dot size = screen height / rows (relative), not a fixed pixel size

 cv.style.width=cw+'px';cv.style.height=ch+'px';
 st.style.width=vw+'px';st.style.height=vh+'px';st.style.transformOrigin='0 0';st.style.transform=rot?'translate('+iw+'px,0) rotate(90deg)':'none';
 st.className=(!PADON||(vw-cw)/2>=148)?'out':'over'; // pads: beside the view / over it (translucent)

function loop(t){if(!tMark)tMark=t;if(fc-fMark>=30){const d=(t-tMark)/(fc-fMark)/1000;if(d>0)dtEst=Math.min(0.05,Math.max(0.004,d));tMark=t;fMark=fc;}const dt=dtEst;last=t;fc++;
 update(dt);if(Math.abs(P.x)>8192||Math.abs(P.y)>8192)rebase();const t0=performance.now();syncWindow(P.x,P.y);render();MS=MS*0.9+(performance.now()-t0)*0.1;FPS=FPS*0.95+(1/Math.max(dt,0.001))*0.05;
